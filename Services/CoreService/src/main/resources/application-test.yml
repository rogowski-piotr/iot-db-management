spring:
  datasource:
    url: jdbc:h2:mem:iot
    driverClassName: org.h2.Driver
    username: admin
    password: adminadmin
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
  h2:
    console:
      enabled: true
